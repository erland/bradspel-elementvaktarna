hero_illustrations:
  version: '0.1'
  shared_style:
    format: wide landscape illustration, 16:9
    resolution: recommended 1600x900 px or larger
    audience: children 7-9 years
    style:
    - polished animated fantasy adventure illustration
    - colorful, cinematic, dynamic but friendly
    - clear silhouette and readable facial expression
    - clean painterly rendering with crisp edges
    - professional board game card art
    - original visual identity, not based on any existing franchise
    composition:
    - hero shown from knees or waist up
    - full head visible with generous space above hair
    - hero centered slightly below the vertical midpoint
    - elemental power visible around hands or weapon
    - background supports the element but stays less detailed than the hero
    - leave breathing room on both sides for cropping
    avoid:
    - text
    - logos
    - watermarks
    - card frames
    - interface elements
    - cropped head
    - extreme close-up
    - photorealism
    - dark horror
    - LEGO or Ninjago resemblance
    - recognizable characters from existing media
  heroes:
  - id: fire_guardian
    filename: assets/heroes/fire_guardian_wide.png
    prompt: Wide 16:9 fantasy adventure illustration for a children's board game. A brave young fire guardian
      in red and gold armor stands in a confident action pose, shown from knees up with the entire head
      and hair clearly visible. One hand controls a bright spiral of flame, the other holds a glowing
      short sword. Warm volcanic landscape and glowing embers in the background, but the hero remains
      the clear focal point. Friendly determined expression, colorful cinematic lighting, polished animated
      fantasy style, crisp silhouette, professional board game card art, original character design. No
      text, no logo, no card border, no watermark, no cropped head, no existing franchise resemblance.
  - id: water_guardian
    filename: assets/heroes/water_guardian_wide.png
    prompt: Wide 16:9 fantasy adventure illustration for a children's board game. A calm young water guardian
      in blue, white and silver armor stands in a graceful action pose, shown from knees up with the entire
      head clearly visible. One hand shapes a sweeping ribbon of water while the other holds an elegant
      staff with a blue crystal. Waterfalls, mist and a luminous river form the background, kept softer
      than the hero. Wise and friendly expression, colorful cinematic lighting, polished animated fantasy
      style, crisp silhouette, professional board game card art, original character design. No text, no
      logo, no card border, no watermark, no cropped head, no existing franchise resemblance.
  - id: wind_guardian
    filename: assets/heroes/wind_guardian_wide.png
    prompt: Wide 16:9 fantasy adventure illustration for a children's board game. A fast young wind guardian
      in turquoise, white and dark teal clothing leaps through the air in a dynamic pose, shown from knees
      up with the entire head clearly visible. Spiraling streams of wind circle the arms and flowing scarf,
      with floating leaves and distant mountain peaks in the background. Energetic but friendly expression,
      colorful cinematic lighting, polished animated fantasy style, crisp silhouette, professional board
      game card art, original character design. No text, no logo, no card border, no watermark, no cropped
      head, no existing franchise resemblance.
  - id: earth_guardian
    filename: assets/heroes/earth_guardian_wide.png
    prompt: Wide 16:9 fantasy adventure illustration for a children's board game. A strong young earth
      guardian in green, brown and bronze armor stands in a protective stance, shown from knees up with
      the entire head clearly visible. One arm carries a large stone shield marked with a glowing original
      rune, while rocks, roots and small crystals rise from the ground around the hero. Forest cliffs
      and ancient stones in the background, kept softer than the hero. Warm confident expression, colorful
      cinematic lighting, polished animated fantasy style, crisp silhouette, professional board game card
      art, original character design. No text, no logo, no card border, no watermark, no cropped head,
      no existing franchise resemblance.
