name: 03 Release Print Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.1.11.1"

      - name: Install system libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y             libcairo2             libpango-1.0-0             libpangocairo-1.0-0             fonts-dejavu-core             shared-mime-info

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Validate project
        run: python scripts/validate_project.py

      - name: Clean and build all printable material
        run: |
          rm -rf output dist
          mkdir -p output
          python scripts/build.py

      - name: Verify generated PDFs
        run: python scripts/verify_print_output.py

      - name: Package release
        run: python scripts/package_release.py --version "${GITHUB_REF_NAME}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             "dist/elementvaktarna-${GITHUB_REF_NAME}-print.zip"             output/pdf/*.pdf             --title "Elementväktarna ${GITHUB_REF_NAME}"             --generate-notes             --verify-tag
