name: 01 Validate

on:
  pull_request:
    branches: [main]
    paths:
      - "assets/**"
      - "data/**"
      - "docs/**"
      - "scripts/**"
      - "templates/**"
      - "README.md"
      - "PROJECT_STATUS.md"
      - "CHANGELOG.md"
      - "RELEASE_INVENTORY.json"
      - "requirements-ci.txt"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "data/**"
      - "docs/**"
      - "scripts/**"
      - "templates/**"
      - "README.md"
      - "PROJECT_STATUS.md"
      - "CHANGELOG.md"
      - "RELEASE_INVENTORY.json"
      - "requirements-ci.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install validation dependency
        run: python -m pip install "PyYAML==6.0.2"

      - name: Validate project
        run: python scripts/validate_project.py
