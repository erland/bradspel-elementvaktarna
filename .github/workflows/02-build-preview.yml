name: 02 Build Preview PDFs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.1.11.1"

      - name: Install system libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y             libcairo2             libpango-1.0-0             libpangocairo-1.0-0             fonts-dejavu-core             shared-mime-info

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Validate project
        run: python scripts/validate_project.py

      - name: Clean generated output
        run: rm -rf output && mkdir -p output

      - name: Build all printable material
        run: python scripts/build.py

      - name: Verify generated PDFs
        run: python scripts/verify_print_output.py

      - name: Upload preview PDFs
        uses: actions/upload-artifact@v4
        with:
          name: elementvaktarna-preview-pdfs
          path: output/pdf/*.pdf
          if-no-files-found: error
          retention-days: 7
