<svg xmlns="http://www.w3.org/2000/svg"
 xmlns:xlink="http://www.w3.org/1999/xlink"
 width="{{CARD_W}}" height="{{CARD_H}}" viewBox="0 0 {{CARD_W}} {{CARD_H}}">
 <rect x="3" y="3" width="{{OUTER_W}}" height="{{OUTER_H}}" rx="16"
       fill="#FFFDF8" stroke="{{PRIMARY}}" stroke-width="6"/>
 <rect x="13" y="13" width="{{HEADER_W}}" height="66" rx="12" fill="{{PRIMARY}}"/>
 <text x="{{CX}}" y="41" text-anchor="middle"
       font-family="DejaVu Sans Condensed, Arial Narrow, sans-serif"
       font-size="{{TITLE_FONT_SIZE}}" font-weight="700" fill="#FFFFFF">{{TITLE}}</text>
 <text x="{{CX}}" y="64" text-anchor="middle"
       font-family="DejaVu Sans, Arial, sans-serif"
       font-size="11" font-weight="700" letter-spacing="1.4"
       fill="#FFFFFF">{{TYPE}}</text>
 <circle cx="{{CX}}" cy="121" r="32" fill="{{SECONDARY}}" stroke="{{PRIMARY}}" stroke-width="4"/>
 <image href="{{ICON_DATA}}" x="{{ICON_X}}" y="96" width="50" height="50"/>
 <rect x="19" y="160" width="{{TEXT_W}}" height="105" rx="12"
       fill="{{SECONDARY}}" stroke="{{PRIMARY}}" stroke-width="3"/>
 {{TEXT_LINES}}
 {{STATUS_BANNER}}
 <text x="{{CX}}" y="300" text-anchor="middle"
       font-family="DejaVu Sans, Arial, sans-serif"
       font-size="10" font-weight="700" fill="{{TEXT_COLOR}}">{{DECK_NAME}}</text>
</svg>