 <text x="113.0" y="183.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#10251C">Om en Kristallväktare</text>
<text x="113.0" y="200.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#10251C">finns på din plats: gör</text>
