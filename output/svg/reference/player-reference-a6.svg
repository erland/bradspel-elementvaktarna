<svg xmlns="http://www.w3.org/2000/svg"
 width="559" height="397" viewBox="0 0 559 397">
 <rect width="559" height="397" fill="#FFFFFF"/>
 <rect x="7" y="7" width="545" height="383" rx="18"
       fill="#FFFDF7" stroke="#245B46" stroke-width="5"/>
 <rect x="16" y="16" width="527" height="48" rx="12" fill="#245B46"/>
 <text x="279.5" y="47" text-anchor="middle"
       font-family="DejaVu Sans Condensed, sans-serif"
       font-size="24" font-weight="700" fill="#FFFFFF">ELEMENTVÄKTARNA · REFERENS</text>
 <line x1="279.5" y1="73" x2="279.5" y2="300"
       stroke="#C7D8D0" stroke-width="2"/>
 <rect x="20" y="76" width="255" height="224" rx="8" fill="#F7FAF8" stroke="#C7D8D0" stroke-width="1.4"/><rect x="20" y="76" width="255" height="19" rx="8" fill="#DDECE5"/><rect x="20" y="87" width="255" height="8" fill="#DDECE5"/><text x="28" y="89.5" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="9.4" font-weight="700" fill="#245B46">DIN TUR</text>
<circle cx="35" cy="105" r="9" fill="#245B46"/>
<text x="35" y="108" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">1</text>
<text x="50" y="108" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="9.2" font-weight="700" fill="#7B4E25">FLYTTA</text>
<text x="50" y="121" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.4" font-weight="400" fill="#17211C">Flytta 0–1 steg längs en väg.</text>
<circle cx="35" cy="136" r="9" fill="#245B46"/>
<text x="35" y="139" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">2</text>
<text x="50" y="139" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="9.2" font-weight="700" fill="#7B4E25">VÄLJ 1 HANDLING</text>
<text x="35" y="161" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.7" font-weight="700" fill="#7B4E25">UTFORSKA</text>
<text x="98" y="161" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.3" font-weight="400" fill="#17211C">Dra 1 äventyrskort.</text>
<text x="35" y="174" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.7" font-weight="700" fill="#7B4E25">KÄMPA</text>
<text x="98" y="174" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.3" font-weight="400" fill="#17211C">Mot Kristallväktare eller</text>
<text x="98" y="184" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.3" font-weight="400" fill="#17211C">Skuggmästaren.</text>
<text x="35" y="197" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.7" font-weight="700" fill="#7B4E25">TRÄNA</text>
<text x="98" y="197" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.3" font-weight="400" fill="#17211C">På Träningsgården: +2 energi,</text>
<text x="98" y="207" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.3" font-weight="400" fill="#17211C">max 5.</text>
<text x="35" y="220" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.7" font-weight="700" fill="#7B4E25">BYGG</text>
<text x="98" y="220" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.3" font-weight="400" fill="#17211C">I Verkstaden: få och fördela 2</text>
<text x="98" y="230" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.3" font-weight="400" fill="#17211C">Skydd.</text>
<circle cx="35" cy="240" r="9" fill="#245B46"/>
<text x="35" y="243" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">3</text>
<text x="50" y="243" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="9.2" font-weight="700" fill="#7B4E25">SKUGGKORT</text>
<text x="50" y="256" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.4" font-weight="400" fill="#17211C">Dra och lös 1 skuggkort.</text>
<rect x="284" y="76" width="255" height="114" rx="8" fill="#F7FAF8" stroke="#C7D8D0" stroke-width="1.4"/><rect x="284" y="76" width="255" height="19" rx="8" fill="#DDECE5"/><rect x="284" y="87" width="255" height="8" fill="#DDECE5"/><text x="292" y="89.5" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="9.4" font-weight="700" fill="#245B46">PLATSKRAFTER</text>
<text x="294" y="107" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="7.8" font-weight="400" fill="#17211C">Matchande hjälte · endast mot Kristallväktare.</text>
<text x="294" y="123" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.5" font-weight="700" fill="#7B4E25">ELD</text>
<text x="355" y="123" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.3" font-weight="400" fill="#17211C">3+ mot Kristallväktaren.</text>
<text x="294" y="139" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.5" font-weight="700" fill="#7B4E25">VATTEN</text>
<text x="355" y="139" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.3" font-weight="400" fill="#17211C">+1 energi efter seger.</text>
<text x="294" y="155" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.5" font-weight="700" fill="#7B4E25">VIND</text>
<text x="355" y="155" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.3" font-weight="400" fill="#17211C">Slå om ett misslyckat slag.</text>
<text x="294" y="171" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.5" font-weight="700" fill="#7B4E25">JORD</text>
<text x="355" y="171" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.3" font-weight="400" fill="#17211C">Miss = ingen energiförlust.</text>
<rect x="284" y="198" width="255" height="102" rx="8" fill="#F7FAF8" stroke="#C7D8D0" stroke-width="1.4"/><rect x="284" y="198" width="255" height="19" rx="8" fill="#DDECE5"/><rect x="284" y="209" width="255" height="8" fill="#DDECE5"/><text x="292" y="211.5" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="9.4" font-weight="700" fill="#245B46">STRID OCH SKYDD</text>
<text x="294" y="230" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.5" font-weight="700" fill="#7B4E25">STRIDSSLAG</text>
<text x="294" y="244" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.2" font-weight="400" fill="#17211C">• Kristallväktare 4+</text>
<text x="294" y="257" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.2" font-weight="400" fill="#17211C">• Skuggvakt 3+</text>
<text x="294" y="270" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.2" font-weight="400" fill="#17211C">• Skuggmästaren 4+</text>
<text x="416" y="230" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.5" font-weight="700" fill="#7B4E25">SKYDD</text>
<text x="416" y="244" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.0" font-weight="400" fill="#17211C">• 1 Skydd = +1 före slag</text>
<text x="416" y="257" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.0" font-weight="400" fill="#17211C">• eller stoppa -1 energi</text>
<text x="416" y="270" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="7.6" font-weight="400" fill="#17211C">• stoppar aldrig Ljusförlust</text>
<rect x="20" y="309" width="519" height="70" rx="9" fill="#F1E6C8"/>
<text x="31" y="329" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.4" font-weight="700" fill="#7B4E25">SLUT PÅ ENERGI</text>
<text x="31" y="342" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.1" font-weight="400" fill="#17211C">Flytta till Träningsgården</text>
<text x="31" y="353" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.1" font-weight="400" fill="#17211C">och få 2 energi.</text>
<text x="207" y="329" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.4" font-weight="700" fill="#7B4E25">KRISTALLBELÖNINGAR</text>
<text x="207" y="342" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="7.8" font-weight="400" fill="#17211C">Eld +1 energi  •  Vatten alla +1</text>
<text x="207" y="353" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="7.8" font-weight="400" fill="#17211C">Vind flytta 1  •  Jord 2 Skydd</text>
<text x="405" y="329" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.4" font-weight="700" fill="#7B4E25">SKUGGMÄSTAREN</text>
<text x="405" y="342" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="7.8" font-weight="400" fill="#17211C">Kräver alla 4 kristaller · 4 liv.</text>
<text x="405" y="354" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.0" font-weight="400" fill="#17211C">Miss: -1 energi och -1 Ljus.</text>
<text x="405" y="366" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="8.0" font-weight="400" fill="#17211C">Ljuset släcks = förlust.</text>
 
 
</svg>